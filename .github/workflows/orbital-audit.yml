name: Orbital Audit CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Audit Website Performance & Security
        env:
          ORBITAL_API_URL: ${{ secrets.ORBITAL_API_URL }}
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
        run: |
          TARGET_URL="${DEPLOY_URL:-https://example.com}"

          if [ -n "$ORBITAL_API_URL" ]; then
            echo "Using remote Orbital API: $ORBITAL_API_URL"
            node ./bin/orbital.mjs "$TARGET_URL" \
              --api-url "$ORBITAL_API_URL" \
              --fail-under 80 \
              --format markdown \
              --output ./audit-report.md
          else
            echo "Starting local Orbital server..."
            npm start &
            SERVER_PID=$!

            # Wait for server to become ready (max 30s)
            for i in $(seq 1 30); do
              if curl -s -f http://127.0.0.1:3000/ > /dev/null 2>&1; then
                echo "Local Orbital server is up and running on port 3000."
                break
              fi
              echo "Waiting for server to start... ($i/30)"
              sleep 1
            done

            node ./bin/orbital.mjs "$TARGET_URL" \
              --api-url "http://127.0.0.1:3000" \
              --fail-under 80 \
              --format markdown \
              --output ./audit-report.md

            kill $SERVER_PID 2>/dev/null || true
          fi

      - name: Upload Audit Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbital-audit-report
          path: ./audit-report.md
          if-no-files-found: ignore
